<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinRAG · 智能金融助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <svg class="logo-icon icon" viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            FinRAG
        </div>

        <div class="nav-group">
            <div class="nav-label">工作区</div>
            <a href="#" class="nav-item active" data-tab="ask">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                智能问答
            </a>
            <a href="#" class="nav-item" data-tab="queue">
                <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                解析队列
            </a>
        </div>

        <div class="nav-group"></div>
    </aside>

    <!-- Main Content -->
    <main class="main">
        <header class="top-bar">
            <div class="page-title" id="pageTitle">智能问答</div>
            <div class="user-menu">
                <!-- Placeholder for user profile if needed, keeping it clean for now -->
            </div>
        </header>

        <div class="content-area">
            <!-- View: Ask -->
            <section id="view-ask" class="view-section active">
                <div class="chat-container is-initial">
                    <div class="welcome-hero">
                        <div class="hero-logo">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        </div>
                        <h2>你好，我是 FinRAG 智能助手</h2>
                        <p>请问有什么关于财务文档的问题需要我解答吗？</p>
                    </div>

                    <div class="messages-list" id="messagesContainer">
                        <!-- Messages will be injected here -->
                    </div>
                    
                    <div class="input-area">
                        <div class="input-box">
                            <textarea id="chatInput" placeholder="请输入您的问题..." rows="1"></textarea>
                            <button id="sendBtn" class="action-btn primary" title="发送">
                                <svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- View: Queue -->
            <section id="view-queue" class="view-section">
                <div class="queue-header">
                    <div class="search-box">
                        <svg class="icon search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="queueSearch" placeholder="搜索文档...">
                    </div>
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">全部</button>
                        <button class="filter-btn" data-filter="processing">处理中</button>
                        <button class="filter-btn" data-filter="success">已收录</button>
                        <button class="filter-btn" data-filter="failed">失败</button>
                    </div>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th width="40%">文件名</th>
                                <th>状态</th>
                                <th>类型</th>
                                <th>大小</th>
                                <th>更新时间</th>
                                <th width="10%">操作</th>
                            </tr>
                        </thead>
                        <tbody id="queueBody">
                            <!-- Rows injected via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
